[package]
name = "ownground"
version = "0.1.0"
edition = "2021"
description = "OwnGround — communities pool NEAR, acquire a productive asset through DAO governance, earn revenue from it, and distribute earnings under an approved policy. NEAR testnet only."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.5"
# near-sdk's own "abi" feature cannot be enabled for wasm32 (its schemars
# dep is host-only), so enable the abi feature on near-account-id directly:
# that gives AccountId its JsonSchema impl on wasm32 via feature unification.
near-account-id = { version = "3", features = ["abi"] }
borsh = "1"
schemars = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
near-sdk = { version = "5.5", features = ["unit-testing"] }
# Integration test (contract/tests/demo.rs): local sandbox chain.
near-workspaces = "0.24"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
anyhow = "1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
# Unwind, NOT abort: with panic = "abort" every contract panic (a failed
# assert, a bad argument, the spending-policy rejection) becomes a bare
# `unreachable` trap with no message, so no caller can ever learn WHY a
# call failed. The demo's proof 2 requires the receipt to carry the
# spending-policy panic text ("expense exceeds max_single_expense"), and
# the site's failure classifier reads panic text too. Unwind keeps the
# message. (Found live 2026-11-09: create_community trapped with a bare
# unreachable for every input, including deliberately invalid ones.)
overflow-checks = true
