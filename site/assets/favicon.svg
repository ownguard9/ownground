<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="OwnGround logo">
  <title>OwnGround</title>
  <!-- Roof: the asset the community owns together. -->
  <path d="M10 32 L32 12 L54 32" fill="none" stroke="#2fbf71" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Sprout: growth from what the community owns. -->
  <path d="M32 50 V36" fill="none" stroke="#2fbf71" stroke-width="4" stroke-linecap="round"/>
  <path d="M32 44 C25 44 21 38 21 31 C28 31 32 37 32 44 Z" fill="#2fbf71"/>
  <path d="M32 40 C39 40 43 34 43 27 C36 27 32 33 32 40 Z" fill="#2fbf71"/>
  <!-- Ground: the shared base everything stands on. -->
  <rect x="10" y="50" width="44" height="6" rx="3" fill="#4da3ff"/>
</svg>
